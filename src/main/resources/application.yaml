spring:
  application:
    name: google_places_mcp_server

  main:
    web-application-type: none

  ai:
    mcp:
      server:
        name: google-places-mcp-server
        version: 1.0.0
        type: SYNC
        stdio: true

google:
  places:
    base-url: https://places.googleapis.com/v1 # ← kebab-case
    api-key: ${GOOGLE_PLACES_API_KEY:} # ← kebab-case
    headers:
      key: X-Goog-Api-Key
